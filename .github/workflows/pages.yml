name: Deploy to GitHub Pages

# Адреса Google Apps Script НЕ живе в репозиторії. Секрет
# APPS_SCRIPT_ENDPOINT зберігається тут: Settings -> Secrets and
# variables -> Actions -> New repository secret.
#
# Що це дає:
#   URL не потрапить у git-історію       - так
#   URL не видно в самому репозиторії    - так
#   URL не видно на сторінці github.io   - ні, там лежить зібраний env.js
#
# Третій рядок навмисний: адреса не секрет і секретом бути не
# може - вона лежить у env.js, який браузер завантажує щонаразу.
# Секрет захищає не від подиву, а від копії репозиторію.
#
# Якби env.js лежав у git, клон або вилка підняли б сайт, який
# стукає у цю таблицю. У бюджет нічого б не потрапило - своїх
# паролів у копії немає. Страждав би ендпоинт входу: вхід і
# реєстрація сесії не потребують, тож кожна чужа спроба увійти
# плюсується до спільного лічильника й блокує вхід сім'ї на 15
# хвилин.
#
# З секретом копія просто не збирається: крок нижче падає на
# порожньому секреті.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build environment file from secret
        env:
          APPS_SCRIPT_ENDPOINT: ${{ secrets.APPS_SCRIPT_ENDPOINT }}
        run: |
          set -eu
          mkdir -p assets/js/generated

          if [ -z "${APPS_SCRIPT_ENDPOINT}" ]; then
            echo "::error::Secret APPS_SCRIPT_ENDPOINT is not set. Add it in repo settings."
            exit 1
          fi

          printf 'window.__MONEYFLOW_ENV__ = { APPS_SCRIPT_ENDPOINT: "%s" };\n' \
            "$APPS_SCRIPT_ENDPOINT" > assets/js/generated/env.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
